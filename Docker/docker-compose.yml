#1. Актуальная версия docker/docker compose (без legacy синтаксиса). Файл начинается сразу с ключа services:. Синтаксис Compose Specification
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: realworld
      POSTGRES_PASSWORD: realworld
      POSTGRES_DB: realworld
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net  # БД видна только бекенду
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realworld -d realworld"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      # Prisma требует именно эту переменную в формате: postgresql://user:password@host:port/dbname
      - DATABASE_URL=postgresql://realworld:realworld@db:5432/realworld
      - JWT_SECRET=super_secret_student_key
    networks:
      - backend_net
      - frontend_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://localhost:8888/api
    volumes:
      - frontend_build:/app/build # Передаем собранную статику в Nginx
    # Собираем проект и оставляем контейнер "живым" через tail -f /dev/null
    command: sh -c "npm run build && echo 'Build done!' && tail -f /dev/null"
    networks:
      - frontend_net

  nginx:
    image: nginx:alpine
    ports:
      - "8888:80" # ЕДИНСТВЕННЫЙ сервис, доступный извне Ограничение прямого доступ извне. ports: (проброс портов на хост) указана только у сервиса nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app_frontend.conf:/etc/nginx/conf.d/app_frontend.conf:ro
      - ./nginx/app_backend.conf:/etc/nginx/conf.d/app_backend.conf:ro
      - frontend_build:/usr/share/nginx/html:ro # Забираем статику у frontend
    networks:
      - frontend_net
    depends_on:
      - backend
      - frontend

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

volumes:
  pg_data:        # Данные БД хранятся вечно, даже при удалении контейнера
  frontend_build: # Временное хранилище для передачи файлов сборки
